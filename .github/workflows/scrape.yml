name: Scrape Schools

on:

# Runs daily at 05:00 UTC.

schedule:
- cron: "0 5 * * *"

# Allows manual runs from the GitHub Actions tab.

workflow_dispatch:

permissions:
contents: write

jobs:
scrape:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v7

  - name: Set up Python
    uses: actions/setup-python@v7
    with:
      python-version: "3.12"
      cache: pip

  - name: Install dependencies
    run: pip install -r requirements.txt

  - name: Run scraper
    run: python main.py

  - name: Copy events.json to dashboard/public
    run: cp data/events.json dashboard/public/events.json

  - name: Commit updated events.json
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"
      git add data/events.json dashboard/public/events.json
      git diff --cached --quiet || git commit -m "chore: update events.json [skip ci]"
      git push origin HEAD:main
```
